// ---------- Процедурные текстуры ----------
function tex(w,fn,rep){const c=document.createElement('canvas');c.width=c.height=w;fn(c.getContext('2d'),w);const t=new R.CanvasTexture(c);t.wrapS=t.wrapT=R.RepeatWrapping;t.repeat.set(rep,rep);return t}

const brickT=tex(256,(x,w)=>{x.fillStyle='#bd9d6e';x.fillRect(0,0,w,w);x.strokeStyle='#8f7448';x.lineWidth=3;for(let r=0;r<8;r++){x.beginPath();x.moveTo(0,r*32);x.lineTo(w,r*32);x.stroke();for(let c=(r%2)*32;c<w;c+=64){x.beginPath();x.moveTo(c,r*32);x.lineTo(c,r*32+32);x.stroke()}}grain(x,w,1500,['#c9aa7a','#a98a5c'],3)},1);
const crateT=tex(128,(x,w)=>{x.fillStyle='#8a5a2b';x.fillRect(0,0,w,w);for(let i=0;i<w;i+=16){x.fillStyle=i%32?'#7a4d22':'#94622f';x.fillRect(0,i,w,15)}x.strokeStyle='#4d2f14';x.lineWidth=8;x.strokeRect(4,4,w-8,w-8);x.beginPath();x.moveTo(0,0);x.lineTo(w,w);x.stroke()},1);

wall(-28,-26,-7,-25);wall(-49,-26,-40,-25);wall(-40,-26,-28,-25,2,4);
wall(7,-26,30,-25);wall(-24,-49,-23,-36);wall(18,-49,19,-36);

[[30,-38],[32,-38],[32,-38,1],[40,-32],[24,-44],[45,-40],[-30,-40],[-32,-40],[-32,-40,1],[-44,-34],[-28,-45],[0,-40],[10,-35],[-12,-35],[-20,5],[-25,15],[30,10],[38,20],[4,-20],[-4,-18],[0,30],[-30,38],[30,25],[-44,-12]].forEach(a=>crate(...a));

// ---------- Коллизии ----------
function blocked(x,z,y,r,h){for(const c of cols)if(x+r>c.x1&&x-r<c.x2&&z+r>c.z1&&z-r<c.z2&&y<c.y2-.05&&y+h>c.y1)return 1;return 0}
function ground(x,z,y,r){let g=0;for(const c of cols)if(x+r>c.x1&&x-r<c.x2&&z+r>c.z1&&z-r<c.z2&&c.y2<=y+.05&&c.y2>g)g=c.y2;return g}
// ---------- Звук (Web Audio) ----------
let AC,nb;function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return AC}
function snd(o){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;f.type=o.t||'lowpass';f.frequency.value=o.f;g.gain.setValueAtTime(o.v,t);g.gain.exponentialRampToValueAtTime(.001,t+o.d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t,Math.random()*.5);s.stop(t+o.d)}
function tone(fq,d,v,ty='sine',fe){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(fq,t);if(fe)o.frequency.exponentialRampToValueAtTime(fe,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
const click=()=>snd({t:'highpass',f:2500,d:.05,v:.3});
// ---------- Оружие ----------
const W=[{n:'AK-47',mag:30,rate:.1,auto:1,d:33,h:110,rec:.012,sp:.004},{n:'Glock',mag:12,rate:.22,d:25,h:100,rec:.02,sp:.003},{n:'Нож',knife:1,rate:.5,d:55},{n:'AWP',mag:5,rate:1.4,d:115,h:200,rec:.05,sp:.0005}];
const ammo=[30,12,0,5],res=[90,48,0,20],mz=[-.85,-.28,0,-1.15];
let prim=0,slot=0,cur=0,reloading=0,relT=0,relDur=1.7,relHalf=0,nextShot=0,kick=0,kickAcc=0,lastShot=0,aim=0,mouseL=0;
const gun=new R.Group();cam.add(gun);gun.position.set(.26,-.24,-.5);
const bx=(g,w,h,d,x,y,z,c)=>{const m=new R.Mesh(new R.BoxGeometry(w,h,d),new R.MeshLambertMaterial({color:c}));m.position.set(x,y,z);g.add(m);return m};
const gm=[0,1,2,3].map(()=>{const g=new R.Group();gun.add(g);return g});
bx(gm[0],.06,.09,.55,0,0,0,0x2b2b2b);bx(gm[0],.055,.07,.3,0,-.01,-.38,0x7a4a1e);bx(gm[0],.05,.1,.25,0,-.01,.38,0x7a4a1e);bx(gm[0],.045,.2,.08,0,-.14,-.08,0x222222).rotation.x=.3;bx(gm[0],.025,.025,.3,0,.02,-.65,0x111111);
bx(gm[1],.05,.06,.28,0,0,-.05,0x2a2a2a);bx(gm[1],.045,.14,.06,0,-.09,.04,0x111111);
bx(gm[2],.015,.05,.3,0,0,-.2,0xcccccc);bx(gm[2],.03,.04,.12,0,0,0,0x222222);
bx(gm[3],.06,.09,.9,0,0,-.1,0x3a4a2a);bx(gm[3],.05,.05,.3,0,.09,-.1,0x111111);bx(gm[3],.03,.03,.5,0,.01,-.75,0x111111);bx(gm[3],.05,.1,.3,0,-.02,.5,0x3a4a2a);
bx(gun,.08,.08,.4,0,-.18,.25,0xc99a6a);
const fl=new R.Mesh(new R.PlaneGeometry(.25,.25),new R.MeshBasicMaterial({color:0xffcc55,transparent:true,opacity:.9,depthWrite:false}));fl.visible=false;gun.add(fl);
function sw(i){slot=i;cur=[prim,1,2][i];reloading=0;gm.forEach((g,k)=>g.visible=k==cur)}sw(0);
// ---------- Игрок ----------
const P={x:0,y:0,z:-42,vy:0,yaw:0,pitch:0,hp:100,ar:0,money:3000,eye:1.65,onG:1,crouch:0,spd:0};
let locked=0,buyOpen=0,pdead=0,ending=0,kills=0,rnd=1,stepT=0,hm=0,dmg=0;const score={ct:0,t:0},keys={};
function msg(t,ms=2500){$('msg').textContent=t;setTimeout(()=>{if($('msg').textContent==t)$('msg').textContent=''},ms)}
function kf(t){const d=document.createElement('div');d.textContent=t;$('kf').prepend(d);setTimeout(()=>d.remove(),5000)}
function moveP(dt){
 const k=keys,f=(k.KeyW?1:0)-(k.KeyS?1:0),s=(k.KeyD?1:0)-(k.KeyA?1:0),walk=k.ShiftLeft||k.ShiftRight;
 P.crouch=!!(k.ControlLeft||k.ControlRight||k.KeyC);
 const sp=(P.crouch?2.2:walk?3.2:6)*(cur==2?1.18:1)*(cur==3&&aim?.6:1),l=Math.hypot(f,s)||1,sn=Math.sin(P.yaw),cs=Math.cos(P.yaw);
 const vx=(-sn*f+cs*s)/l*sp,vz=(-cs*f-sn*s)/l*sp,h=P.crouch?1.1:1.8;
 const nx=P.x+vx*dt;if(!blocked(nx,P.z,P.y,.4,h))P.x=nx;const nz=P.z+vz*dt;if(!blocked(P.x,nz,P.y,.4,h))P.z=nz;
 P.spd=(f||s)?sp:0;
 if(k.Space&&P.onG){P.vy=9;P.onG=0}
 P.vy-=22*dt;let ny=P.y+P.vy*dt;const g=ground(P.x,P.z,P.y,.4);
 if(ny<=g){ny=g;P.vy=0;P.onG=1}else P.onG=0;P.y=ny;
 P.eye+=((P.crouch?1.2:1.65)-P.eye)*Math.min(1,dt*12);
 if(P.onG&&P.spd>4&&!P.crouch){stepT-=dt;if(stepT<=0){stepT=.36;snd({f:350,d:.06,v:.1})}}

}
// ---------- Эффекты ----------
const fx=[],tr=[],holes=[],pg=new R.BoxGeometry(.06,.06,.06),pm=[new R.MeshBasicMaterial({color:0xd8c090}),new R.MeshBasicMaterial({color:0xffdd66})];
function impact(p,n){for(let i=0;i<7;i++){const m=new R.Mesh(pg,pm[i%3?0:1]);m.position.copy(p);sc.add(m);fx.push({m,v:new V3(n.x+Math.random()-.5,n.y+Math.random()*.8,n.z+Math.random()-.5).multiplyScalar(2.5),l:.5})}
 const h=new R.Mesh(new R.CircleGeometry(.06,8),new R.MeshBasicMaterial({color:0x2a2218}));h.position.copy(p).addScaledVector(n,.01);h.lookAt(p.clone().add(n));sc.add(h);holes.push(h);if(holes.length>40)sc.remove(holes.shift())}
function tracer(a,b,c){const l=new R.Line(new R.BufferGeometry().setFromPoints([a,b]),new R.LineBasicMaterial({color:c,transparent:true}));sc.add(l);tr.push({l,t:.08})}
// ---------- Боты ----------
const WP=[[0,38],[-25,36],[30,36],[0,15],[0,-5],[-20,10],[-44,12],[-44,-10],[-35,-38],[35,-38],[40,-10],[20,5],[0,-35],[-15,-38]];
const SP=[[0,40],[-20,38],[30,38],[10,15],[-44,12]],bots=[],rcast=new R.Raycaster();
function mkBot(){const g=new R.Group(),parts=[],b={g,parts,x:0,z:0,ry:0,hp:100,alive:1,wp:0,alert:0,react:0,cd:0},L=c=>new R.MeshLambertMaterial({color:c});
 const add=(geo,c,x,y,z,p)=>{const m=new R.Mesh(geo,L(c));m.position.set(x,y,z);m.castShadow=true;m.userData={bot:b,head:p=='h'};g.add(m);if(p)parts.push(m)};
 add(new R.BoxGeometry(.6,.8,.35),0x55503a,0,1.15,0,'b');add(new R.SphereGeometry(.19,10,8),0x222222,0,1.72,0,'h');
 add(new R.BoxGeometry(.25,.75,.25),0x33302a,-.15,.38,0,'b');add(new R.BoxGeometry(.25,.75,.25),0x33302a,.15,.38,0,'b');
 add(new R.BoxGeometry(.15,.6,.15),0x55503a,-.38,1.15,-.1,'b');add(new R.BoxGeometry(.08,.1,.6),0x111111,.3,1.25,-.4);

for(let i=0;i<5;i++)mkBot();
const botParts=()=>bots.filter(b=>b.alive).flatMap(b=>b.parts);
function los(ax,ay,az,bx,by,bz){const d=new V3(bx-ax,by-ay,bz-az),L=d.length();rcast.set(new V3(ax,ay,az),d.normalize());rcast.far=L;return !rcast.intersectObjects(solids,false).length}
function hurt(d){if(pdead)return;const a=Math.min(P.ar,d*.5);P.ar-=a;P.hp-=d-a;dmg=.6;tone(180,.12,.3,'square');
 if(P.hp<=0&&!ending){P.hp=0;pdead=1;ending=1;score.t++;P.money+=1400;msg('Вы погибли',3500);setTimeout(startRound,3500)}}
function botShot(b,d){const ch=Math.max(.12,.65-d*.012)*(P.spd>3?.8:1)*(P.crouch?.8:1),o=new V3(b.x,1.3,b.z),t=new V3(P.x,P.y+P.eye-.3,P.z),hit=Math.random()<ch;
 if(!hit){t.x+=Math.random()*2-1;t.y+=Math.random()*1.5-.75;t.z+=Math.random()*2-1}
 tracer(o,t,0xff7744);snd({f:2200,d:.15,v:Math.min(.4,3/(d+5))});if(hit)hurt(9+Math.random()*9)}
function botUpd(b,dt){
 if(!b.alive){if(b.g.rotation.x>-1.5)b.g.rotation.x-=dt*5;return}
 const dx=P.x-b.x,dz=P.z-b.z,d=Math.hypot(dx,dz),fa=Math.atan2(-dx,-dz);let diff=fa-b.ry;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
 b.alert=Math.max(0,b.alert-dt);b.cd-=dt;
 const seen=!pdead&&d<80&&(Math.abs(diff)<1.1||b.alert>0)&&los(b.x,1.6,b.z,P.x,P.y+P.eye,P.z);
 if(seen){b.alert=3;b.ry+=diff*Math.min(1,dt*8);b.react+=dt;if(b.react>.45&&b.cd<=0){b.cd=.3+Math.random()*.25;botShot(b,d)}}
 else{b.react=0;const t=WP[b.wp],tx=t[0]-b.x,tz=t[1]-b.z,td=Math.hypot(tx,tz);

  else{const s=3*dt,nx=b.x+tx/td*s,nz=b.z+tz/td*s;let mv=0;
   if(!blocked(nx,b.z,0,.4,1.8)){b.x=nx;mv=1}if(!blocked(b.x,nz,0,.4,1.8)){b.z=nz;mv=1}
   if(!mv)b.wp=Math.random()*WP.length|0;
   let df=Math.atan2(-tx,-tz)-b.ry;df=Math.atan2(Math.sin(df),Math.cos(df));b.ry+=df*Math.min(1,dt*6)}}
 b.g.position.set(b.x,0,b.z);b.g.rotation.y=b.ry}
// ---------- Стрельба ----------
function hitBot(b,head,w){if(!b.alive)return;b.hp-=head?w.h:w.d;b.alert=3;b.react=0;tone(head?1600:900,.09,.25);hm=.15;$('hit').style.borderColor=head?'#f33':'#fff';
 if(b.hp<=0){b.alive=0;P.money=Math.min(16000,P.money+300);kills++;kf('Вы ➜ Террорист'+(head?'  🎯 HS':'')+'  +$300')}}
function shoot(){
 const w=W[cur],n=performance.now()/1000;if(n<nextShot||reloading||pdead)return;
 const d=cam.getWorldDirection(new V3());
 if(w.knife){nextShot=n+w.rate;kick=1.5;snd({t:'bandpass',f:1500,d:.15,v:.2});rcast.set(cam.position,d);rcast.far=2.6;const h=rcast.intersectObjects(botParts(),false)[0];if(h)hitBot(h.object.userData.bot,0,w);return}
 if(ammo[cur]<=0){nextShot=n+.3;click();reload();return}

 let sp=w.sp+Math.min(P.spd,6)*.0045+(P.onG?0:.05)+kickAcc*.1;if(cur==3&&!aim)sp+=.07;if(aim&&cur!=3)sp*=.7;if(P.crouch)sp*=.7;

 P.pitch=Math.min(1.5,P.pitch+w.rec);kickAcc+=w.rec;P.yaw+=(Math.random()-.5)*w.rec*.6;kick=1;
 fl.position.set(0,.02,mz[cur]);fl.rotation.z=Math.random()*6;fl.visible=true;setTimeout(()=>fl.visible=false,45);
 snd({f:cur==3?1800:3200,d:cur==3?.35:.18,v:.5});tone(cur==3?70:110,.12,.45,'sine',35);
 rcast.set(cam.position,d);rcast.far=200;const h=rcast.intersectObjects(solids.concat(botParts()),false)[0];
 const mp=gun.localToWorld(new V3(0,.02,mz[cur])),end=h?h.point:cam.position.clone().addScaledVector(d,100);tracer(mp,end,0xffee88);
 if(h){if(h.object.userData.bot)hitBot(h.object.userData.bot,h.object.userData.head,w);else impact(h.point,h.face.normal.clone().transformDirection(h.object.matrixWorld))}
 if(ammo[cur]==0&&res[cur]>0)reload()}
function reload(){const w=W[cur];if(w.knife||reloading||ammo[cur]>=w.mag||res[cur]<=0)return;reloading=1;relT=0;relHalf=0;relDur=cur==3?2.4:1.7;click()}
// ---------- Магазин ----------
function toggleBuy(){buyOpen=!buyOpen;$('buy').style.display=buyOpen?'flex':'none';$('bm').textContent='Деньги: $'+P.money;
 if(buyOpen)document.exitPointerLock();else document.body.requestPointerLock()}
function buy(n){const c=[0,2700,4750,650,250][n];if(P.money<c){tone(150,.2,.3,'square');return}P.money-=c;tone(700,.1,.25);
 if(n==1){prim=0;ammo[0]=30;res[0]=90}if(n==2){prim=3;ammo[3]=5;res[3]=20}if(n==3)P.ar=100;if(n==4){res[0]+=60;res[1]+=24;res[3]+=10}
 sw(slot);$('bm').textContent='Деньги: $'+P.money}
// ---------- Раунды ----------
function startRound(){ending=0;pdead=0;Object.assign(P,{x:(Math.random()-.5)*8,z:-42,y:0,vy:0,hp:100,yaw:0,pitch:0});ammo[0]=30;ammo[1]=12;ammo[3]=5;
 bots.forEach((b,i)=>{b.alive=1;b.hp=100;b.alert=0;b.react=0;b.x=SP[i][0];b.z=SP[i][1];b.wp=Math.random()*WP.length|0;b.g.rotation.x=0});msg('Раунд '+rnd)}
// ---------- Ввод ----------
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===document.body;$('menu').style.display=(locked||buyOpen)?'none':'flex'});
$('menu').onclick=()=>{ac();document.body.requestPointerLock()};
addEventListener('mousemove',e=>{if(!locked||pdead)return;const s=.0022*(cur==3&&aim?.35:1);P.yaw-=e.movementX*s;P.pitch=Math.max(-1.5,Math.min(1.5,P.pitch-e.movementY*s))});
addEventListener('mousedown',e=>{if(!locked)return;if(e.button==0){mouseL=1;if(!W[cur].auto)shoot()}if(e.button==2)aim=1});
addEventListener('mouseup',e=>{if(e.button==0)mouseL=0;if(e.button==2)aim=0});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{if(locked)sw((slot+(e.deltaY>0?1:2))%3)});
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ControlLeft'].includes(e.code))e.preventDefault();
 if(e.code=='KeyB'&&!e.repeat){toggleBuy();return}
 if(buyOpen&&/^Digit[1-4]$/.test(e.code)){buy(+e.key);return}
 if(!locked)return;if(e.code=='KeyR')reload();if(/^Digit[1-3]$/.test(e.code))sw(+e.key-1)});
addEventListener('keyup',e=>keys[e.code]=0);
// ---------- Радар / HUD ----------
const rx=$('radar').getContext('2d');
function radar(){rx.clearRect(0,0,140,140);rx.save();rx.beginPath();rx.arc(70,70,70,0,7);rx.clip();rx.fillStyle='rgba(20,30,20,.65)';rx.fillRect(0,0,140,140);
 rx.translate(70,70);rx.rotate(P.yaw);const s=70/45;rx.scale(s,s);rx.translate(-P.x,-P.z);rx.fillStyle='#c9ad78';
 for(const c of cols)if(c.y1<2)rx.fillRect(c.x1,c.z1,c.x2-c.x1,c.z2-c.z1);
 rx.fillStyle='#f33';for(const b of bots)if(b.alive&&b.alert>0){rx.beginPath();rx.arc(b.x,b.z,1.6,0,7);rx.fill()}
 rx.restore();rx.fillStyle='#4af';rx.beginPath();rx.moveTo(70,62);rx.lineTo(65,77);rx.lineTo(75,77);rx.fill()}
function hud(){
 $('hp').textContent='❤ '+Math.ceil(P.hp)+'   🛡 '+Math.ceil(P.ar);
 $('ammo').innerHTML=W[cur].n+'<br>'+(W[cur].knife?'—':(reloading?'перезарядка…':ammo[cur]+' / '+res[cur]));
 $('money').textContent='$'+P.money;$('score').textContent='CT '+score.ct+' : '+score.t+' T  |  Раунд '+rnd+'  |  Убийств '+kills;
 const sc_=cur==3&&aim,gap=5+P.spd*1.6+kickAcc*120+(P.onG?0:8)+(aim?-3:0);
 [`translate(-1px,${-gap-8}px)`,`translate(-1px,${gap}px)`,`translate(${-gap-8}px,-1px)`,`translate(${gap}px,-1px)`].forEach((t,i)=>{const c=$('c'+i);c.style.transform=t;c.style.display=sc_?'none':'block'});
 $('scope').style.display=sc_&&cam.fov<40?'block':'none';gun.visible=!(sc_&&cam.fov<40);
 $('hit').style.opacity=hm>0?1:0;$('dm').style.opacity=pdead?.85:dmg}
// ---------- Главный цикл ----------
let last=performance.now(),bob=0;
function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
 if(locked&&!buyOpen){
  if(!pdead){moveP(dt);if(mouseL&&W[cur].auto)shoot()}else{cam.position.y=Math.max(.3,cam.position.y-dt*2);cam.rotation.z=Math.min(1,cam.rotation.z+dt)}
  if(now/1000-lastShot>.25&&kickAcc>0){const d=Math.min(kickAcc,dt*.35);P.pitch-=d;kickAcc-=d}
  if(reloading){relT+=dt;if(!relHalf&&relT>relDur*.5){relHalf=1;click()}
   if(relT>=relDur){const n=Math.min(W[cur].mag-ammo[cur],res[cur]);ammo[cur]+=n;res[cur]-=n;reloading=0;click()}}
  bots.forEach(b=>botUpd(b,dt));
  if(!ending&&bots.every(b=>!b.alive)){ending=1;rnd++;score.ct++;P.money+=3250;msg('Раунд выигран! +$3250',3800);setTimeout(startRound,4000)}
 }
 kick*=Math.pow(.0005,dt);bob+=dt*P.spd*1.6;
 const rt=reloading?Math.sin(Math.PI*relT/relDur):0;
 gun.position.set(.26-(aim?.26:0)+Math.sin(bob)*.008*(P.spd>0),-.24-rt*.3-(aim?.02:0)+Math.abs(Math.cos(bob))*.006*(P.spd>0),-.5+kick*.07);
 gun.rotation.x=kick*.12+rt*.9;
 const tf=aim?(cur==3?18:62):75;cam.fov+=(tf-cam.fov)*Math.min(1,dt*14);cam.updateProjectionMatrix();
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.v.y-=9*dt;f.m.position.addScaledVector(f.v,dt);if((f.l-=dt)<=0){sc.remove(f.m);fx.splice(i,1)}}
 for(let i=tr.length-1;i>=0;i--){const t=tr[i];t.l.material.opacity=t.t/.08;if((t.t-=dt)<=0){sc.remove(t.l);t.l.geometry.dispose();tr.splice(i,1)}}
 hm-=dt;dmg=Math.max(0,dmg-dt*1.2);hud();radar();rd.render(sc,cam)}
startRound();loop();
</script></body></html>
